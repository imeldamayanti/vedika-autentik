[project]
name = "vedika-ai-service"
version = "0.5.0"
description = "PRAMANA document analysis service for Vedika Autentik"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "loguru>=0.7,<1",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<6",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vedika_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

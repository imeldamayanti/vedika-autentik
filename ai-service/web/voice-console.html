<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vedika Agen Suara · Simulasi</title>
<style>
  body { font: 16px/1.45 system-ui, sans-serif; max-width: 820px; margin: 32px auto; padding: 0 20px; color: #17202a; }
  fieldset { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border: 1px solid #ccd4dc; border-radius: 10px; margin: 16px 0; padding: 16px; }
  label { display: grid; gap: 4px; } input, select, button { font: inherit; padding: 8px; }
  .wide { grid-column: 1 / -1; } button { cursor: pointer; } #transkrip { white-space: pre-wrap; background: #f5f7f9; min-height: 120px; padding: 12px; }
  #tugas { white-space: pre-wrap; background: #f5f7f9; padding: 12px; overflow-wrap: anywhere; }
  #aksi { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; min-height: 44px; }
  .simulasi { background: #fff4ce; padding: 8px 12px; border-radius: 8px; }
  .galat { color: #a4262c; }
</style>
<h1>Vedika Agen Suara</h1>
<p class="simulasi"><strong>Simulasi.</strong> Gunakan data fiktif dan nomor tim. Jangan gunakan data peserta nyata.</p>

<fieldset>
  <legend>Sambungan</legend>
  <label class="wide">URL API backend <input id="apiUrl" value="http://localhost:8000"></label>
  <label>Kunci agen (X-Kunci-Agen) <input id="kunciAgen" type="password" autocomplete="off"></label>
  <label>Kunci layanan ai-service (opsional) <input id="kunciLayanan" type="password" autocomplete="off"></label>
</fieldset>

<fieldset>
  <legend>Audio</legend>
  <label>Input WhatsApp <select id="inputDevice"></select></label>
  <label>Output AI <select id="outputDevice"></select></label>
  <button id="muatDevice" class="wide" type="button">Muat perangkat audio</button>
</fieldset>

<p><button id="mulai" type="button">Mulai agen</button> <button id="henti" type="button" disabled>Hentikan agen</button></p>
<p>Status: <strong id="status">siap</strong></p>
<p id="galat" class="galat" aria-live="polite"></p>
<pre id="tugas">Belum ada tugas.</pre>
<p id="aksiTeks"></p>
<div id="aksi"></div>
<div id="transkrip" aria-live="polite"></div>

<script type="module">
  import { VedikaVoiceSession, createAgentApi, runTask, waitForTask } from "./voice-agent.mjs";

  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  let running = false;

  const setStatus = (text) => { $("status").textContent = text; };
  const showError = (error) => { $("galat").textContent = `Galat: ${error.message}`; };

  async function muatDevice() {
    const permission = await navigator.mediaDevices.getUserMedia({ audio: true });
    permission.getTracks().forEach((track) => track.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    for (const [element, kind, preferred] of [
      [$("inputDevice"), "audioinput", "BlackHole 2ch"],
      [$("outputDevice"), "audiooutput", "BlackHole 16ch"],
    ]) {
      element.replaceChildren();
      devices.filter((device) => device.kind === kind).forEach((device) => {
        const option = new Option(device.label || `${kind} ${element.length + 1}`, device.deviceId);
        option.selected = device.label.includes(preferred);
        element.add(option);
      });
    }
  }

  function ask(text, actions, link) {
    return new Promise((resolve) => {
      $("aksiTeks").textContent = text;
      const nodes = [];
      if (link) {
        const anchor = Object.assign(document.createElement("a"), {
          href: link, target: "_blank", rel: "noopener", textContent: "Buka WhatsApp",
        });
        nodes.push(anchor);
      }
      for (const [label, value] of actions) {
        const button = Object.assign(document.createElement("button"), { type: "button", textContent: label });
        button.addEventListener("click", () => {
          $("aksi").replaceChildren();
          $("aksiTeks").textContent = "";
          resolve(value);
        });
        nodes.push(button);
      }
      $("aksi").replaceChildren(...nodes);
    });
  }

  async function countdown(seconds) {
    for (let left = seconds; left > 0; left -= 1) {
      $("aksiTeks").textContent = `Tunggu ${left} detik sebelum menelepon.`;
      await sleep(1000);
    }
  }

  const operator = {
    kirimWa: (task) => ask(`Kirim pesan pemberitahuan ke ${task.no_tujuan}, lalu tekan kirim di WhatsApp.`, [["Pesan WA terkirim", true]], task.wa.tautan),
    telepon: async (task) => {
      if (!task.wa.lewati) await countdown(task.jeda_wa_menit * 60);
      return ask(`Telepon ${task.no_tujuan} lewat WhatsApp Desktop.`, [["Saya menelepon", true]]);
    },
    diangkat: () => ask("Apakah telepon diangkat?", [["Diangkat", true], ["Tidak diangkat", false]]),
    kirimChatCadangan: (chat) => ask("Dua kali tidak diangkat. Kirim chat cadangan.", [["Chat cadangan terkirim", true]], chat.tautan),
  };

  function converse(task, { onStarted, onTurn }) {
    return new Promise((resolve) => {
      $("transkrip").textContent = "";
      const kunciLayanan = $("kunciLayanan").value;
      const session = new VedikaVoiceSession({
        context: task.skrip,
        headers: kunciLayanan ? { "X-Kunci-Layanan": kunciLayanan } : {},
        inputDeviceId: $("inputDevice").value,
        outputDeviceId: $("outputDevice").value,
        onStatus: (value) => setStatus(`${task.id}: ${value}`),
        onTranscript: (turn) => {
          $("transkrip").textContent += `[${turn.detik}] ${turn.pembicara}: ${turn.teks}\n`;
          onTurn(turn);
        },
        onError: showError,
        onComplete: ({ transkrip, recording, durasi }) => resolve({ transkrip, rekaman: recording, durasi }),
      });
      ask("Panggilan berlangsung.", [["Akhiri panggilan", true]]).then(() => session.stop("selesai"));
      session.start().then(() => onStarted()).catch(showError);
    });
  }

  async function jalankanAgen() {
    const api = createAgentApi({ baseUrl: $("apiUrl").value, agentKey: $("kunciAgen").value });
    while (running) {
      setStatus("menunggu tugas");
      const task = await waitForTask(api, { isRunning: () => running, onError: showError });
      if (!task) break;
      $("galat").textContent = "";
      $("tugas").textContent = JSON.stringify(task, null, 2);
      try {
        const reply = await runTask({ api, task, operator, converse, onError: showError });
        setStatus(`${task.id}: ${reply?.status ?? "selesai"}`);
      } catch (error) {
        showError(error);
        await sleep(3000);
      }
      $("aksi").replaceChildren();
      $("aksiTeks").textContent = "";
    }
    setStatus("berhenti");
    $("mulai").disabled = false;
  }

  $("muatDevice").addEventListener("click", () => muatDevice().catch(showError));
  $("mulai").addEventListener("click", () => {
    running = true;
    $("mulai").disabled = true;
    $("henti").disabled = false;
    jalankanAgen();
  });
  $("henti").addEventListener("click", () => {
    running = false;
    $("henti").disabled = true;
  });
</script>
</html>

<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stasiun saluran Vedika · Simulasi</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #17202a; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 14px 0; padding: 12px; border: 1px solid #ccd4dc; border-radius: 10px; }
  dt { color: #5b6773; } dd { margin: 0; overflow-wrap: anywhere; }
  button { font: inherit; padding: 8px 14px; cursor: pointer; }
  #transkrip { white-space: pre-wrap; background: #f5f7f9; min-height: 120px; padding: 12px; border-radius: 10px; }
  .simulasi { background: #fff4ce; padding: 8px 12px; border-radius: 8px; }
  .galat { color: #a4262c; min-height: 1.4em; }
  .ok { color: #0b6a3b; } .tidak { color: #a4262c; }
</style>
<h1>Stasiun saluran Vedika</h1>
<p class="simulasi"><strong>Simulasi.</strong> Gunakan data fiktif dan nomor tim. Jangan gunakan data peserta nyata.</p>
<p id="pesan"></p>
<p><button id="mulai" type="button" hidden>Mulai</button> <button id="henti" type="button" hidden>Hentikan</button></p>
<dl>
  <dt>Stasiun</dt><dd id="status">memuat</dd>
  <dt>HP saluran</dt><dd id="hp">–</dd>
  <dt>SIM</dt><dd id="sim">–</dd>
  <dt>Audio</dt><dd id="audio">–</dd>
  <dt>Tugas</dt><dd id="tugas">Belum ada tugas.</dd>
  <dt>Tahap panggilan</dt><dd id="fase">–</dd>
</dl>
<p id="galat" class="galat" aria-live="polite"></p>
<div id="transkrip" aria-live="polite"></div>

<script type="module">
  import {
    AUDIO_BLOCKED, VedikaVoiceSession, createAgentApi, createLineApi, createStationOperator, pickDevice, runTask, stationTick,
  } from "./voice-agent.mjs";

  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const jam = () => new Date().toLocaleTimeString("id-ID", { hour12: false });
  const setStatus = (text) => { $("status").textContent = text; };
  const showError = (error) => { $("galat").textContent = `${jam()} Galat terakhir: ${error.message}`; };
  const PROCESSING = {
    speaker: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    kabel: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  };
  const line = createLineApi();
  let running = false;
  let probe = null;
  let devices = null;

  async function siapkanAudio(konfigurasi) {
    const permission = await navigator.mediaDevices.getUserMedia({ audio: true });
    permission.getTracks().forEach((track) => track.stop());
    const all = await navigator.mediaDevices.enumerateDevices();
    const chosen = {};
    for (const [key, kind, hint] of [["input", "audioinput", konfigurasi.input], ["output", "audiooutput", konfigurasi.output]]) {
      chosen[key] = pickDevice(all, kind, hint);
      if (hint && !chosen[key]) throw new Error(`Perangkat audio "${hint}" tidak ditemukan`);
    }
    $("audio").textContent = `mode ${konfigurasi.audio} · masuk: ${chosen.input?.label || "bawaan"} · keluar: ${chosen.output?.label || "bawaan"}`;
    return chosen;
  }

  async function jalankan(konfigurasi) {
    const api = createAgentApi({ baseUrl: konfigurasi.api_url, agentKey: konfigurasi.kunci_agen || "" });
    const headers = konfigurasi.kunci_layanan ? { "X-Kunci-Layanan": konfigurasi.kunci_layanan } : {};
    const operator = createStationOperator({
      line,
      onError: showError,
      onLog: (entry) => { $("transkrip").textContent += `· ${entry}\n`; },
      onPhase: (phase) => { $("fase").textContent = phase; },
      startSession: (options) => {
        const session = new VedikaVoiceSession({
          ...options,
          headers,
          inputDeviceId: devices.input?.deviceId,
          outputDeviceId: devices.output?.deviceId,
          lineConstraints: PROCESSING[konfigurasi.audio],
          onTranscript: (turn, all) => {
            $("transkrip").textContent += `[${turn.detik}] ${turn.pembicara}: ${turn.teks}\n`;
            options.onTranscript(turn, all);
          },
        });
        session.start().catch(showError);
        return session;
      },
    });
    probe = probe || new AudioContext();
    while (running) {
      try {
        if (probe.state !== "running") await Promise.race([probe.resume(), sleep(500)]);
        devices = devices || await siapkanAudio(konfigurasi);
        const { sehat, siap, blocked, task } = await stationTick({ line, api, audioReady: () => probe.state === "running", onError: showError });
        $("hp").textContent = sehat.perangkat || "–";
        $("sim").textContent = sehat.sim || "–";
        $("status").className = siap ? "ok" : "tidak";
        setStatus(blocked ? AUDIO_BLOCKED : siap ? "siap, menunggu tugas" : `belum siap: ${sehat.alasan}`);
        if (task) {
          $("galat").textContent = "";
          $("transkrip").textContent = "";
          $("tugas").textContent = `${task.id} · ${task.skrip.nama_pasien} · percobaan ${task.percobaan}`;
          $("fase").textContent = "menunggu jeda pesan WA";
          setStatus("sedang menelepon");
          // The loop is busy with this call, so keep the heartbeat going or the website shows the line as down.
          const denyut = setInterval(() => api.detak({ siap: true, alasan: null, perangkat: sehat.perangkat ?? null }).catch(() => {}), 3000);
          try {
            const reply = await runTask({ api, task, operator, converse: operator.converse, onError: showError, onLog: (entry) => { $("transkrip").textContent += `· ${entry}\n`; } });
            $("fase").textContent = `selesai: ${reply?.status ?? "terkirim"}`;
          } finally {
            clearInterval(denyut);
          }
          continue;
        }
      } catch (error) {
        showError(error);
        await line.tutup().catch(() => {});
      }
      await sleep(3000);
    }
    setStatus("berhenti");
    $("status").className = "";
    $("mulai").hidden = false;
    $("henti").hidden = true;
  }

  async function muat() {
    let konfigurasi;
    try {
      konfigurasi = await line.konfigurasi();
    } catch (error) {
      setStatus("tidak aktif");
      $("pesan").textContent = error.status === 404
        ? "Halaman ini hanya berjalan di laptop stasiun (SALURAN_ADB belum aktif)."
        : `Phone helper tidak bisa dihubungi: ${error.message}`;
      return;
    }
    const mulai = () => {
      if (running) return;
      running = true;
      $("mulai").hidden = true;
      $("henti").hidden = false;
      jalankan(konfigurasi);
    };
    $("mulai").addEventListener("click", mulai);
    $("henti").addEventListener("click", () => { running = false; setStatus("berhenti setelah tugas ini"); });
    if (new URLSearchParams(location.search).get("mulai") === "1") mulai();
    else { $("mulai").hidden = false; setStatus("siap dimulai"); }
  }
  muat();
</script>
</html>

    <script>
      const C = __CFG__;
      const T = C.T;
      const W = 1920, H = 1080;
      const tl = gsap.timeline({ paused: true });

      // ---------------------------------------------------------------- kamera demo
      // Kamera virtual = SATU lintasan kontinu (cx, cy, ln zoom) pada rekaman 1920x1080, dibangun dari titik singgah
      // (waypoint) dengan interpolasi kubik monoton (PCHIP, kecepatan kontinu, tanpa overshoot). Kamera tidak pernah
      // berhenti-lalu-jalan di tiap pergantian adegan; ia hanya melambat alami di titik fokus dan saat arah berbalik.
      // Zoom diinterpolasi di ruang logaritmik, x/y dihitung ulang tiap frame dari titik fokus.
      const camKeys = [];
      function ck(t, cx, cy, s) { camKeys.push({ t, cx, cy, lz: Math.log(s) }); }
      function camPrep() {
        camKeys.sort((a, b) => a.t - b.t);
        const n = camKeys.length;
        for (const ch of ["cx", "cy", "lz"]) {
          const h = [], d = [], m = new Array(n).fill(0);
          for (let i = 0; i < n - 1; i++) { h[i] = camKeys[i + 1].t - camKeys[i].t; d[i] = (camKeys[i + 1][ch] - camKeys[i][ch]) / h[i]; }
          for (let i = 1; i < n - 1; i++) {
            if (d[i - 1] * d[i] <= 0) m[i] = 0;
            else {
              const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1];
              m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
            }
          }
          camKeys.forEach((k, i) => { k["m" + ch] = m[i]; });
        }
      }
      function camAt(t) {
        const n = camKeys.length;
        if (t <= camKeys[0].t) return camKeys[0];
        if (t >= camKeys[n - 1].t) return camKeys[n - 1];
        let i = 0;
        while (camKeys[i + 1].t <= t) i++;
        const a = camKeys[i], b = camKeys[i + 1], h = b.t - a.t, u = (t - a.t) / h;
        const u2 = u * u, u3 = u2 * u;
        const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
        const f = (ch) => h00 * a[ch] + h10 * h * a["m" + ch] + h01 * b[ch] + h11 * h * b["m" + ch];
        return { cx: f("cx"), cy: f("cy"), lz: f("lz") };
      }
      function camApply(c) {
        const s = Math.exp(c.lz);
        let x, y;
        if (s < 1) { x = W * (1 - s) / 2; y = H * (1 - s) / 2 + 24 * (1 - s); }   // jendela utuh, rata tengah di latar mint
        else {
          x = Math.min(0, Math.max(W - s * W, W / 2 - s * c.cx));
          y = Math.min(0, Math.max(H - s * H, H / 2 - s * c.cy));
        }
        gsap.set("#win", { x, y, scale: s });
      }
      function camPlay() {
        camPrep();
        const t0 = camKeys[0].t, t1 = camKeys[camKeys.length - 1].t, o = { v: 0 };
        tl.fromTo(o, { v: 0 }, {
          v: 1, duration: t1 - t0, ease: "none", immediateRender: false,
          modifiers: { v: (v) => { camApply(camAt(t0 + v * (t1 - t0))); return v; } },
        }, t0);
      }
      // potongan isi rekaman: lebur singkat (klip berikutnya naik di atas klip sebelumnya), tanpa blur
      C.XF.forEach((x) => tl.fromTo("#" + x.id, { opacity: 0 }, { opacity: 1, duration: C.XFD, ease: "sine.inOut" }, x.s));
      // W3: rekaman aslinya scroll instan (tabel → daftar di atas). Tiruan scroll halus: klip keluar dan masuk
      // bergeser 297 px berlawanan sehingga baris filter keduanya berimpit sepanjang lebur, tanpa bayangan ganda.
      tl.fromTo("#w3b", { y: -297 }, { y: 0, duration: 0.3, ease: "power2.inOut" }, C.W3_CUT);
      tl.fromTo("#w3a", { y: 0 }, { y: 297, duration: 0.3, ease: "power2.inOut" }, C.W3_CUT);

      // ---------------------------------------------------------------- H1 / H2: hook sinematik
      tl.set("#black", { opacity: 1 }, 0);
      tl.to("#black", { opacity: 0, duration: 0.9, ease: "power1.out" }, 0.05);
      tl.fromTo("#lb1 i", { scaleY: 1.6 }, { scaleY: 1, duration: 1.4, ease: "power2.out" }, 0);
      tl.fromTo("#tag1", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.4);
      tl.fromTo("#in-h1a", { scale: 1.04, xPercent: 0 }, { scale: 1.13, xPercent: -1.2, duration: C.H1A_END, ease: "none" }, 0);
      tl.fromTo("#in-h1b", { scale: 1.34 }, { scale: 1.42, duration: T.h2.s + 0.4 - C.H1A_END, ease: "none" }, C.H1A_END);
      // H1 → H2: lebur 0,45 dtk dengan sedikit blur, bukan potong keras
      tl.set("#sh-h2a", { opacity: 0 }, 0);
      tl.to("#sh-h2a", { opacity: 1, duration: 0.45, ease: "sine.inOut" }, T.h2.s - 0.05);
      tl.to("#in-h1b", { filter: "blur(6px)", duration: 0.45, ease: "sine.in" }, T.h2.s - 0.05);
      tl.fromTo("#in-h2a", { scale: 1.05 }, { scale: 1.12, duration: C.H2A_END - T.h2.s, ease: "none" }, T.h2.s);
      // pertanyaan: potong lebih dekat ke wajah, dorongan pelan, warna meredup menjelang pindai
      tl.fromTo("#in-h2b", { scale: 1.36 }, { scale: 1.5, duration: C.H2B_END - C.H2A_END, ease: "sine.in" }, C.H2A_END);
      tl.to("#h2b", { "--hf-color-grading-exposure": -0.55, duration: 0.9, ease: "sine.in" }, T.h2b.s - 0.2);
      // beban verifikator: antrean berkas di-dim di bawah letterbox, dorongan sangat pelan
      tl.set("#sh-pn", { opacity: 0 }, 0);
      tl.to("#sh-pn", { opacity: 1, duration: 0.8, ease: "sine.inOut" }, T.h2b.s + 0.2);
      tl.fromTo("#in-pn", { scale: 1.3 }, { scale: 1.42, duration: T.h3.s + 0.7 - T.h2b.s - 0.2, ease: "none" }, T.h2b.s + 0.2);
      tl.set("#sh-pn", { opacity: 0 }, T.h3.s + 0.7);   // overlay peredam ikut hilang setelah kartu logo menutup
      tl.to("#lb1 i", { scaleY: 1.9, duration: 0.7, ease: "power2.in" }, T.h3.s - 0.6);
      tl.to("#tag1", { opacity: 0, duration: 0.3 }, T.h2b.s + 0.1);

      // ---------------------------------------------------------------- H3: pindai lalu kunci
      const h = T.h3.s;
      function lockIn(p, t0, opt) {
        // sayap V bertemu, titik emas jatuh seperti stempel + cincin, wordmark naik dari masker, garis oranye
        tl.fromTo(`#${p}-wl`, { x: -14, rotation: -7, opacity: 0, transformOrigin: "50% 100%" },
          { x: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t0);
        tl.fromTo(`#${p}-wr`, { x: 14, rotation: 7, opacity: 0, transformOrigin: "50% 100%" },
          { x: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t0);
        tl.fromTo(`#${p}-mw`, { scale: 1 }, { scale: 1.04, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, t0 + 0.42);
        tl.fromTo(`#${p}-flash`, { opacity: 0 }, { opacity: 0.32, duration: 0.033, ease: "none", yoyo: true, repeat: 1 }, t0 + 0.42);
        tl.fromTo(`#${p}-dot`, { scale: 0, y: -9, transformOrigin: "50% 50%" },
          { scale: 1, y: 0, duration: 0.42, ease: "back.out(1.5)" }, t0 + 0.5);
        tl.set(`#${p}-ring`, { opacity: 0 }, 0);
        tl.fromTo(`#${p}-ring`, { scale: 1, opacity: 0.95, transformOrigin: "50% 50%" },
          { scale: 4.2, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, t0 + 0.62);
        tl.fromTo(`#${p}-w1`, { yPercent: 105 }, { yPercent: 0, duration: 0.62, ease: "power3.out" }, t0 + 0.7);
        tl.fromTo(`#${p}-w2`, { yPercent: 105 }, { yPercent: 0, duration: 0.62, ease: "power3.out" }, t0 + 0.82);
        tl.fromTo(`#${p}-line`, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, t0 + 1.3);
        // hold yang hidup: logo melayang, glow bernapas, satu kilau lewat
        tl.fromTo(`#${p}-mw`, { y: 0 }, { y: -4, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: opt.floats }, t0 + 1.9);
        tl.fromTo(`#${p}-lock .wm-sh`, { backgroundPosition: "150% 0%" },
          { backgroundPosition: "-50% 0%", duration: 1.2, ease: "power1.inOut", stagger: 0.08 }, t0 + opt.shine);
      }
      // garis pindai menyapu kiri → kanan; di belakangnya frame terakhir H2 jadi teal lalu pekat
      tl.fromTo("#h3-scan", { x: -30, opacity: 1 }, { x: W + 30, duration: 0.55, ease: "power1.inOut" }, h);
      tl.fromTo("#h3-in", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power1.inOut" }, h);
      tl.fromTo("#h3-bg", { opacity: 0.8 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, h + 0.4);
      tl.set("#h3-scan", { opacity: 0 }, h + 0.56);
      tl.set(["#h3-scan2", "#z-scan"], { opacity: 0 }, 0);
      tl.fromTo("#h3-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, h + 0.5);
      lockIn("h3", C.H3_LOCK, { floats: 2, shine: 3.4 });
      // keluar: garis pindai turun atas → bawah, membuka jendela demo
      tl.set("#h3-scan2", { opacity: 1, y: -10 }, C.STAGE_IN);
      tl.to("#h3-scan2", { y: H + 10, duration: 0.5, ease: "power1.inOut" }, C.STAGE_IN);
      tl.to("#h3-in", { clipPath: "inset(100% 0% 0% 0%)", duration: 0.5, ease: "power1.inOut" }, C.STAGE_IN);

      // ---------------------------------------------------------------- panggung demo
      tl.set("#stage", { opacity: 0 }, 0);
      tl.set("#stage", { opacity: 1 }, C.STAGE_IN);
      tl.fromTo("#mint-dots", { x: 0, y: 0 }, { x: -34, y: -34, duration: T.w7.e - C.STAGE_IN, ease: "none" }, C.STAGE_IN);
      tl.fromTo("#scrim-top", { opacity: 0 }, { opacity: 1, duration: 0.6 }, T.w1.s + 0.4);

      // Kamera sengaja tenang: satu framing lebar per bagian, bergeser hanya saat pindah bagian (bersamaan dengan lebur
      // isi rekaman), lalu dorongan sangat pelan (4%) supaya tidak mati. Tidak ada zoom keluar-masuk di dalam bagian.
      // Kunci terakhir sebuah bagian = kunci pertama bagian berikutnya, jadi pergantian tidak memuat loncatan zoom.
      // Satu framing tetap untuk seluruh demo (zoom 1.2, fokus agak ke bawah supaya titik klik W6 di dasar ponsel
      // tetap di atas caption): tidak ada geser atau zoom antarbagian, jadi tidak ada goyang.
      const BASE = [1100, 640, 1.2];
      ck(C.STAGE_IN, BASE[0], BASE[1], BASE[2] * 0.94);   // settle kecil saat kartu logo tersapu
      ck(C.STAGE_IN + 1.4, ...BASE);
      ck(T.w7.e, ...BASE);
      camPlay();

      // label langkah: dibuka dengan masker dari kiri, tanpa terbang masuk
      document.querySelectorAll(".step").forEach((el) => {
        const s = parseFloat(el.dataset.start), d = parseFloat(el.dataset.duration);
        const inner = el.querySelector(".step-in");
        tl.fromTo(inner, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out" }, s + 0.12);
        tl.fromTo(el.querySelector(".step-rule"), { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, s + 0.2);
        tl.to(inner, { opacity: 0, duration: 0.2 }, s + d - 0.22);
      });

      // ---------------------------------------------------------------- Z: adegan hangat → logo + slogan
      tl.set("#sh-zv", { opacity: 0 }, 0);
      tl.to("#sh-zv", { opacity: 1, duration: 0.6, ease: "sine.inOut" }, C.Z_CLIP_IN);
      tl.fromTo("#in-zv", { scale: 1.1 }, { scale: 1.02, duration: C.Z_SCAN + 0.7 - C.Z_CLIP_IN, ease: "sine.out" }, C.Z_CLIP_IN);
      tl.fromTo("#lb2 i", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power3.out" }, C.Z_CLIP_IN + 0.1);
      tl.fromTo("#tag2", { opacity: 0 }, { opacity: 1, duration: 0.5 }, C.Z_CLIP_IN + 0.5);
      tl.set("#stage", { opacity: 0 }, C.Z_CLIP_IN + 0.7);
      const z = C.Z_SCAN;
      tl.fromTo("#z-scan", { x: -30, opacity: 1 }, { x: W + 30, duration: 0.55, ease: "power1.inOut" }, z);
      tl.fromTo("#zc-in", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power1.inOut" }, z);
      tl.fromTo("#z-bg", { opacity: 0.8 }, { opacity: 1, duration: 0.6 }, z + 0.4);
      tl.set("#z-scan", { opacity: 0 }, z + 0.56);
      tl.fromTo("#z-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, z + 0.5);
      lockIn("z", z + 0.55, { floats: 2, shine: 4.4 });
      tl.fromTo("#z-slogan", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, C.Z_SLOGAN);
      tl.fromTo("#z-credit", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, C.Z_CREDIT);
      tl.set("#endfade", { opacity: 0 }, 0);
      tl.to("#endfade", { opacity: 1, duration: 0.6, ease: "sine.in" }, C.TOTAL - 0.6);

      // ---------------------------------------------------------------- subtitle: muncul halus, hilang cepat
      document.querySelectorAll(".sub").forEach((el) => {
        const s = parseFloat(el.dataset.start), d = parseFloat(el.dataset.duration);
        const p = el.querySelector("p");
        tl.fromTo(p, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, s);
        tl.to(p, { opacity: 0, duration: 0.14, ease: "power1.in" }, s + d - 0.14);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

    <style>

        --w-bg: oklch(100% 0 0); --w-muted: oklch(98% .002 90); --w-fg: oklch(14% .002 90); --w-fg2: oklch(34% .004 90); --w-mfg: oklch(52% .006 90);

      .card-glow { position: absolute; left: 50%; top: 45%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px;

      .card-grid { position: absolute; inset: 0; opacity: 0.16;

        mask-image: radial-gradient(ellipse 60% 60% at 50% 45%, #000 0%, transparent 75%); }

      .scan-v { position: absolute; top: 0; bottom: 0; left: 0; width: 6px; background: var(--orange); z-index: 5;

      .scan-h { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--orange); z-index: 5;
        box-shadow: 0 0 18px 4px rgba(242, 107, 33, 0.7), 0 0 80px 22px rgba(242, 107, 33, 0.28); }
      .flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 55%); }
      .tagline { position: absolute; left: 0; right: 0; top: 770px; text-align: center; color: var(--mint); font-size: 66px; font-weight: 500; letter-spacing: -0.01em; }

        font-size: 28px; font-weight: 500; letter-spacing: 0.06em; }

    <script>
      const C = __CFG__;
      const T = C.T, S = C.S, W = 1920, H = 1080;
      const tl = gsap.timeline({ paused: true });

      // ---------------------------------------------------------------- kamera: lintasan kontinu antar pose (PCHIP)
      const camKeys = [];
      function ck(t, cx, cy, s) { camKeys.push({ t, cx, cy, lz: Math.log(s) }); }
      function camPrep() {
        camKeys.sort((a, b) => a.t - b.t);
        const n = camKeys.length;
        for (const ch of ["cx", "cy", "lz"]) {
          const h = [], d = [], m = new Array(n).fill(0);
          for (let i = 0; i < n - 1; i++) { h[i] = camKeys[i + 1].t - camKeys[i].t; d[i] = (camKeys[i + 1][ch] - camKeys[i][ch]) / h[i]; }
          for (let i = 1; i < n - 1; i++) {
            if (d[i - 1] * d[i] <= 0) m[i] = 0;
            else { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]); }
          }
          camKeys.forEach((k, i) => { k["m" + ch] = m[i]; });
        }
      }
      function camAt(t) {
        const n = camKeys.length;
        if (t <= camKeys[0].t) return camKeys[0];
        if (t >= camKeys[n - 1].t) return camKeys[n - 1];
        let i = 0;
        while (camKeys[i + 1].t <= t) i++;
        const a = camKeys[i], b = camKeys[i + 1], h = b.t - a.t, u = (t - a.t) / h, u2 = u * u, u3 = u2 * u;
        const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
        const f = (ch) => h00 * a[ch] + h10 * h * a["m" + ch] + h01 * b[ch] + h11 * h * b["m" + ch];
        return { cx: f("cx"), cy: f("cy"), lz: f("lz") };
      }
      function camApply(c) {
        const s = Math.exp(c.lz);
        let x, y;
        if (s < 1) { x = W * (1 - s) / 2; y = H * (1 - s) / 2 + 24 * (1 - s); }
        else { x = Math.min(0, Math.max(W - s * W, W / 2 - s * c.cx)); y = Math.min(0, Math.max(H - s * H, H / 2 - s * c.cy)); }
        gsap.set("#win", { x, y, scale: s });
      }
      function camPlay() {
        camPrep();
        const t0 = camKeys[0].t, t1 = camKeys[camKeys.length - 1].t, o = { v: 0 };
        tl.fromTo(o, { v: 0 }, { v: 1, duration: t1 - t0, ease: "none", immediateRender: false,
          modifiers: { v: (v) => { camApply(camAt(t0 + v * (t1 - t0))); return v; } } }, t0);
      }

      // ---------------------------------------------------------------- babak 1: suara Pak Andi -> kalender -> 11 klaim -> 300 pasien
      const B = C.B1, TG = C.TGL;
      TG.forEach((d) => document.getElementById("k2-d" + d).classList.add("t"));   // kalender penutup: tagihan sudah terisi
      tl.set("#black", { opacity: 1 }, 0);
      tl.to("#black", { opacity: 0, duration: 0.6, ease: "power1.out" }, 0.05);
      tl.fromTo("#b1-len", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.2);
      // hook: kartu peserta + gelombang rekaman, playhead ikut audio
      tl.fromTo("#b1-pas", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, B.hook - 0.1);
      tl.fromTo("#b1-rek", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, B.hook);
      const bars = document.querySelectorAll("#b1-wv i");
      bars.forEach((b, i) => tl.set(b, { backgroundColor: "oklch(48% .075 205)" }, B.hook + 0.1 + (i / bars.length) * 3.35));
      // kalender Agustus + tiga pita jawaban Pak Andi (awal bulan, pertengahan, dua puluhan)
      tl.fromTo("#b1-kal .kal-t", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, B.kal);
      tl.fromTo("#b1-kal .kd:not(.x), #b1-kal .kh", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", stagger: 0.008 }, B.kal);
      B.pita.forEach((t, i) => tl.fromTo("#k1-pita" + i, { opacity: 0, scale: 1.12, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, t));
      tl.fromTo("#b1-ver", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, B.ver - 0.2);
      tl.fromTo("#b1-ver3", { scale: 0.3, opacity: 0, transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, B.ver);
      // P2: kolom kiri keluar, 11 baris klaim RS Melati masuk, kalender ikut terisi, counter naik melewati 3 (merah)
      tl.to("#b1-kiri", { opacity: 0, x: -60, duration: 0.35, ease: "power2.in" }, B.p2);
      tl.to("#b1-kal", { x: 210, scale: 0.86, duration: 0.6, ease: "power3.inOut" }, B.p2);
      tl.fromTo("#b1-klaim .kapital", { opacity: 0 }, { opacity: 1, duration: 0.3 }, B.p2 + 0.2);
      tl.fromTo("#b1-cnt", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, B.p2 + 0.3);
      tl.set("#b1-sel", { opacity: 0 }, 0);
      TG.forEach((d, i) => {
        const t = B.kl0 + i * B.kl_dt;
        tl.fromTo("#kl" + i, { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, t);
        const isi = d === 16 || d === 17 ? "oklch(46% .1 60)" : "oklch(14% .002 90)";
        tl.set("#k1-d" + d, { backgroundColor: isi, borderColor: isi, color: "#fff" }, t + 0.08);
        if (d === 16 || d === 17) tl.set("#k1-d" + d + " .tg", { opacity: 1 }, t + 0.08);
        tl.fromTo("#k1-d" + d, { scale: 1.15 }, { scale: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, t + 0.08);
        tl.set("#b1-cnt .strip", { y: -100 * (i + 1) }, t + 0.08);
        if (i + 1 === 4) tl.set("#b1-cnt .strip", { color: "oklch(55% .19 27)" }, t + 0.08);
      });
      tl.fromTo("#b1-cnt .win", { scale: 1 }, { scale: 1.12, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 60%" }, B.kl0 + 10 * B.kl_dt + 0.1);
      tl.fromTo("#b1-sel", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, B.sel);
      // P3: semuanya mengecil jadi satu kotak (Pak Andi) di antara 300 pasien aktif; 30 terpicu menyala
      tl.set("#b1-s3", { opacity: 0 }, 0);
      tl.to("#b1-s2", { scale: 26 / 1920, x: 80, y: 296, duration: 1.0, ease: "power3.inOut" }, B.zoom);
      tl.to("#b1-s2", { opacity: 0, duration: 0.25 }, B.zoom + 0.8);
      tl.fromTo("#b1-s3", { opacity: 0, scale: 1.6, transformOrigin: "93px 303px" }, { opacity: 1, scale: 1, duration: 1.0, ease: "power3.inOut" }, B.zoom);
      tl.set("#b1-s3 .cells i.on", { opacity: 0 }, 0);
      tl.to("#b1-s3 .cells i.on", { opacity: 1, duration: 0.18, stagger: 0.035 }, B.zoom + 1.0);
      tl.fromTo("#b1-andi", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3 }, B.zoom + 0.95);
      tl.fromTo("#kpk", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, B.kpk);
      tl.fromTo("#kpk .n", { scale: 0.92, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.7, ease: "power2.out" }, B.kpk + 0.1);

      // ---------------------------------------------------------------- S: telepon berdering -> logo
      tl.set("#sc-in", { clipPath: "inset(0% 0% 0% 0%)" }, 0);
      tl.fromTo("#sc", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, S.sc);
      tl.fromTo("#sc-phone", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, S.sc + 0.2);
      tl.fromTo("#sc-phone svg", { rotation: -12, transformOrigin: "50% 50%" }, { rotation: 12, duration: 0.09, ease: "none", yoyo: true, repeat: 13 }, S.sc + 0.5);
      tl.fromTo("#sc-w1", { scale: 0.6, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.8, ease: "power1.out", repeat: 1, repeatDelay: 0.1 }, S.sc + 0.5);
      tl.fromTo("#sc-w2", { scale: 0.6, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.8, ease: "power1.out", repeat: 1, repeatDelay: 0.1 }, S.sc + 0.9);
      tl.to("#sc-phone", { scale: 0.3, opacity: 0, duration: 0.25, ease: "power2.in" }, C.HIT - 0.55);
      tl.set(["#sc-w1", "#sc-w2"], { opacity: 0 }, C.HIT - 0.45);
      tl.set("#sc-scan2", { opacity: 0 }, 0);
      tl.fromTo("#sc-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, S.sc + 0.5);
      function lockIn(p, t0, opt) {
        tl.fromTo(`#${p}-wl`, { x: -14, rotation: -7, opacity: 0, transformOrigin: "50% 100%" }, { x: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t0);
        tl.fromTo(`#${p}-wr`, { x: 14, rotation: 7, opacity: 0, transformOrigin: "50% 100%" }, { x: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t0);
        tl.fromTo(`#${p}-mw`, { scale: 1 }, { scale: 1.04, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, t0 + 0.42);
        tl.fromTo(`#${p}-flash`, { opacity: 0 }, { opacity: 0.32, duration: 0.033, ease: "none", yoyo: true, repeat: 1 }, t0 + 0.42);
        tl.fromTo(`#${p}-dot`, { scale: 0, y: -9, transformOrigin: "50% 50%" }, { scale: 1, y: 0, duration: 0.42, ease: "back.out(1.5)" }, t0 + 0.5);
        tl.set(`#${p}-ring`, { opacity: 0 }, 0);
        tl.fromTo(`#${p}-ring`, { scale: 1, opacity: 0.95, transformOrigin: "50% 50%" }, { scale: 4.2, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, t0 + 0.62);
        tl.fromTo(`#${p}-w1`, { yPercent: 105 }, { yPercent: 0, duration: 0.62, ease: "power3.out" }, t0 + 0.7);
        tl.fromTo(`#${p}-w2`, { yPercent: 105 }, { yPercent: 0, duration: 0.62, ease: "power3.out" }, t0 + 0.82);
        tl.fromTo(`#${p}-line`, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, t0 + 1.3);
        tl.fromTo(`#${p}-mw`, { y: 0 }, { y: -4, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: opt.floats }, t0 + 1.9);
        tl.fromTo(`#${p}-lock .wm-sh`, { backgroundPosition: "150% 0%" }, { backgroundPosition: "-50% 0%", duration: 1.2, ease: "power1.inOut", stagger: 0.08 }, t0 + opt.shine);
      }
      lockIn("s", C.HIT - 0.42, { floats: 2, shine: 3.2 });
      tl.fromTo("#sc-tag-in", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.1, ease: "power2.inOut" }, C.TAG_S);
      // keluar: garis pindai turun atas -> bawah membuka jendela demo
      tl.set("#sc-scan2", { opacity: 1, y: -10 }, S.d1 - 0.05);
      tl.to("#sc-scan2", { y: H + 10, duration: 0.5, ease: "power1.inOut" }, S.d1 - 0.05);
      tl.to("#sc-in", { clipPath: "inset(100% 0% 0% 0%)", duration: 0.5, ease: "power1.inOut" }, S.d1 - 0.05);

      // ---------------------------------------------------------------- panggung demo
      tl.set("#stage", { opacity: 0 }, 0);
      tl.set("#stage", { opacity: 1 }, S.d1 - 0.1);
      tl.fromTo("#mint-dots", { x: 0, y: 0 }, { x: -34, y: -34, duration: C.STAGE_D, ease: "none" }, C.STAGE_S);
      C.XF.forEach((x) => tl.fromTo("#" + x.id, { opacity: 0 }, { opacity: 1, duration: C.XFD, ease: "sine.inOut" }, x.s));
      C.CAM.forEach((k) => ck(k[0], k[1], k[2], k[3]));
      camPlay();
      document.querySelectorAll(".step").forEach((el) => {
        const s = parseFloat(el.dataset.start), d = parseFloat(el.dataset.duration), inner = el.querySelector(".step-in");
        tl.fromTo(inner, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.out" }, s + 0.1);
        tl.fromTo(el.querySelector(".step-rule"), { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power2.out" }, s + 0.18);
        tl.to(inner, { opacity: 0, duration: 0.2 }, s + d - 0.22);
      });
      // sorot dalam jendela
      document.querySelectorAll(".ring").forEach((el) => {
        const s = parseFloat(el.dataset.start), d = parseFloat(el.dataset.duration);
        tl.fromTo(el, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, s);
        tl.to(el, { opacity: 0, duration: 0.25 }, s + d - 0.25);
      });
      // overlay layar: masuk dari bawah/samping, keluar memudar
      document.querySelectorAll(".ov").forEach((el) => {
        const s = parseFloat(el.dataset.start), d = parseFloat(el.dataset.duration), dx = parseFloat(el.dataset.dx || 0), dy = parseFloat(el.dataset.dy || 24);
        tl.fromTo(el, { opacity: 0, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, s);
        tl.to(el, { opacity: 0, duration: 0.25 }, s + d - 0.25);
      });
      tl.fromTo("#call-leader", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, C.CALLOUT_S + 0.2);
      // gelombang suara: batang bergerak selama rekaman telepon diputar
      document.querySelectorAll(".waveb i").forEach((b, i) => {
        tl.fromTo(b, { scaleY: 0.25 + (i % 5) * 0.08 }, { scaleY: 0.95 - (i % 4) * 0.12, duration: 0.18 + (i % 6) * 0.045, ease: "sine.inOut", yoyo: true, repeat: 40 }, C.WAVE_S + (i % 7) * 0.02);
      });
      // D4: counter 11 -> 3, garis bawah "Selisih 8"
      tl.fromTo("#c2 .strip", { y: 0 }, { y: -112 * 8, duration: 0.9, ease: "steps(8)" }, C.C2_T0);
      tl.fromTo("#c2 .sel u", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, C.C2_T0 + 1.0);
      // D5: 2/4 Normal -> 3/5 Perlu klarifikasi RS (stempel)
      tl.set("#bd-after", { opacity: 0 }, 0);
      tl.to("#bd-before", { opacity: 0, duration: 0.15 }, C.STAMP_T - 0.25);
      tl.set("#bd-after", { opacity: 1 }, C.STAMP_T);
      tl.fromTo("#bd-after .chipst", { scale: 2.4, rotation: -9, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, rotation: -3, opacity: 1, duration: 0.22, ease: "power4.in" }, C.STAMP_T);
      tl.fromTo("#bd-after .big", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, C.STAMP_T);
      tl.fromTo("#bd", { scale: 1 }, { scale: 1.04, duration: 0.07, yoyo: true, repeat: 1, transformOrigin: "0% 100%" }, C.STAMP_T + 0.2);

      // ---------------------------------------------------------------- penutup
      tl.fromTo("#zb", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, S.z - 0.3);
      tl.fromTo("#zb", { scale: 1.04 }, { scale: 1, duration: 1.2, ease: "power2.out", transformOrigin: "50% 50%" }, S.z - 0.3);
      tl.set("#stage", { opacity: 0 }, S.z + 0.7);
      document.querySelectorAll("#zt .w i").forEach((el, i) => {
        tl.fromTo(el, { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, T.z0 + 0.05 + i * 0.14);
      });
      tl.fromTo("#zk1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, S.z + 0.1);
      tl.fromTo("#zk2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, S.z + 0.3);
      tl.fromTo("#z-kal", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, S.z + 0.2);
      tl.fromTo("#zk3", { opacity: 0, scale: 0.8, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, S.z + 1.1);
      const z = C.Z_SCAN;
      tl.fromTo("#z-scan", { x: -30, opacity: 1 }, { x: W + 30, duration: 0.55, ease: "power1.inOut" }, z);
      tl.fromTo("#zc-in", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power1.inOut" }, z);
      tl.fromTo("#z-bg", { opacity: 0.8 }, { opacity: 1, duration: 0.6 }, z + 0.4);
      tl.set("#z-scan", { opacity: 0 }, z + 0.56);
      tl.fromTo("#z-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, z + 0.5);
      lockIn("z", C.Z_HIT - 0.42, { floats: 2, shine: 3.0 });
      tl.fromTo("#z-slogan", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, T.z1);
      tl.fromTo("#z-credit", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, T.z1 + 1.6);
      tl.set("#endfade", { opacity: 0 }, 0);
      tl.to("#endfade", { opacity: 1, duration: 0.55, ease: "sine.in" }, C.TOTAL - 0.55);

      // ---------------------------------------------------------------- subtitle
      document.querySelectorAll(".sub").forEach((el) => {
        const s = parseFloat(el.dataset.start), d = parseFloat(el.dataset.duration), p = el.querySelector("p");
        tl.fromTo(p, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, s);
        tl.to(p, { opacity: 0, duration: 0.12, ease: "power1.in" }, s + d - 0.12);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

    <style>
      /* palet mengikuti PPT tim: teal gelap, hijau, oranye, navy, mint */
      :root { --teal: #0f3d3e; --green: #0e7c3a; --orange: #f26b21; --navy: #1b2d4f; --mint: #eaf3f1; --slate: #5b6b6a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
      #root { position: relative; width: 100%; height: 100%; font-family: Poppins, Inter, ui-sans-serif, system-ui, sans-serif; color: #fff; overflow: hidden; background: var(--teal); }
      #root > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .ov { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .vignette { position: absolute; inset: 0; background: radial-gradient(120% 100% at 50% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%), linear-gradient(0deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 32%); }
      .tag { position: absolute; right: 34px; top: 28px; padding: 6px 16px; border-radius: 999px; font-size: 20px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; background: rgba(0,0,0,.4); color: rgba(255,255,255,.8); }

      /* kartu logo pembuka */
      #h3 { background: radial-gradient(90% 90% at 50% 45%, #145558 0%, var(--teal) 62%, #082a2b 100%); }
      .lockup { position: absolute; left: 0; right: 0; top: 0; bottom: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
      .lockup .row { display: flex; align-items: center; gap: 30px; }
      .lockup svg { width: 190px; height: 190px; }
      .lockup .name { font-size: 150px; line-height: .95; font-weight: 700; letter-spacing: -0.03em; }
      .lockup .rule { width: 0; height: 6px; border-radius: 3px; background: var(--orange); }

      /* adegan walkthrough: latar putih-mint seperti slide */
      #demo-bg { position: absolute; inset: 0; background: linear-gradient(180deg, #ffffff 0%, var(--mint) 100%); opacity: 0; }
      #win { position: absolute; left: 150px; top: 22px; width: 1620px; height: 911px; border-radius: 18px; overflow: hidden; box-shadow: 0 24px 60px rgba(15,61,62,.22), 0 0 0 1px rgba(15,61,62,.12); opacity: 0; background: #fff; }
      #zoom { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #zoom video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .strip { position: absolute; left: 150px; top: 950px; display: flex; align-items: baseline; gap: 18px; color: var(--teal); }
      .strip .no { font-size: 26px; font-weight: 600; color: var(--green); letter-spacing: .05em; }
      .strip .ti { font-size: 38px; font-weight: 600; letter-spacing: -0.01em; }
      .strip-brand { position: absolute; right: 150px; top: 954px; display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 500; color: #465554; }
      .strip-brand svg { width: 36px; height: 36px; }

      /* penutup */
      #zveil { position: absolute; inset: 0; background: radial-gradient(90% 90% at 50% 45%, #145558 0%, var(--teal) 62%, #082a2b 100%); opacity: 0; }
      .zlock { position: absolute; left: 0; right: 0; top: 0; bottom: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; opacity: 0; }
      .zlock .row { display: flex; align-items: center; gap: 28px; }
      .zlock svg { width: 150px; height: 150px; }
      .zlock .name { font-size: 118px; line-height: .95; font-weight: 700; letter-spacing: -0.03em; }
      .zlock .slogan { margin-top: 18px; font-size: 56px; font-weight: 500; letter-spacing: -0.01em; color: #fff; }
      .zlock .rule { width: 110px; height: 6px; border-radius: 3px; background: var(--orange); }
      .zlock .tim { margin-top: 26px; font-size: 24px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #bfe0c8; }

      #dip { position: absolute; inset: 0; background: #06201f; opacity: 0; pointer-events: none; }
      #caps { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; pointer-events: none; }
      .cap { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 1700px; text-align: center; opacity: 0; white-space: nowrap; font-weight: 500; }
      .cap.demo { padding: 8px 26px 10px; border-radius: 12px; background: rgba(15,61,62,.92); color: #fff; font-size: 33px; line-height: 1.3; }
      .cap.hook { font-size: 46px; line-height: 1.25; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.6); }

    <script>
      const T = {"h1": {"s": 0.0, "d": 5.49, "e": 5.49, "vs": 0.3, "vd": 4.69}, "h2": {"s": 5.49, "d": 5.35, "e": 10.84, "vs": 5.79, "vd": 4.55}, "h3": {"s": 10.84, "d": 5.91, "e": 16.75, "vs": 11.14, "vd": 5.11}, "w1": {"s": 16.75, "d": 6.6, "e": 23.35, "vs": 17.05, "vd": 5.8}, "w2": {"s": 23.35, "d": 6.51, "e": 29.86, "vs": 23.65, "vd": 5.71}, "w3": {"s": 29.86, "d": 8.37, "e": 38.23, "vs": 30.16, "vd": 7.57}, "w4": {"s": 38.23, "d": 8.56, "e": 46.79, "vs": 38.53, "vd": 7.76}, "w5": {"s": 46.79, "d": 6.28, "e": 53.07, "vs": 47.09, "vd": 5.48}, "w6": {"s": 53.07, "d": 9.76, "e": 62.83, "vs": 53.37, "vd": 8.96}, "w7": {"s": 62.83, "d": 7.12, "e": 69.95, "vs": 63.13, "vd": 6.32}, "z": {"s": 69.95, "d": 10.28, "e": 80.23, "vs": 70.25, "vd": 6.78}};
      const CAPS = [{"s": 0.3, "d": 4.69, "t": "Bapak bilang, waktu rehabilitasi dulu, petugasnya yang tanda tangan sendiri.", "k": "hook"}, {"s": 5.79, "d": 4.55, "t": "Berkasnya tampak lengkap. Tapi siapa yang menjamin berkasnya asli?", "k": "hook"}, {"s": 11.14, "d": 5.11, "t": "Vedika Autentik. Teman verifikator untuk memeriksa keaslian berkas klaim.", "k": "hook"}, {"s": 17.05, "d": 5.8, "t": "Berkas klaim dari rumah sakit masuk ke tab Autentik. Satu klik, semuanya diperiksa.", "k": "demo"}, {"s": 23.65, "d": 5.71, "t": "Pertama, kualitas scan. Scan yang buruk akan diminta scan ulang, tanpa penuduhan.", "k": "demo"}, {"s": 30.16, "d": 7.57, "t": "Hasilnya berlabel jelas: lolos, perlu dicek, atau prioritas. Yang paling mendesak selalu di atas.", "k": "demo"}, {"s": 38.53, "d": 7.76, "t": "Buka satu berkas, buktinya langsung terlihat. Angka lima sesi yang diubah jadi delapan, ditandai tepat di tempatnya.", "k": "demo"}, {"s": 47.09, "d": 5.48, "t": "Berkas yang dipakai ulang untuk pasien lain? Disandingkan, kembarannya langsung ketahuan.", "k": "demo"}, {"s": 53.37, "d": 8.96, "t": "Untuk berkas prioritas, peserta ditanya langsung lewat WhatsApp resmi BPJS. Satu balasan, dan Anda tahu yang sebenarnya.", "k": "demo"}, {"s": 63.13, "d": 6.32, "t": "Sistem hanya menyarankan. Keputusan akhir tetap di tangan Anda, lengkap dengan alasan tertulis.", "k": "demo"}, {"s": 70.25, "d": 6.78, "t": "Memeriksa lebih tenang, memutuskan lebih adil. Vedika Autentik. Lengkap belum tentu asli.", "k": "hook"}];
      const tl = gsap.timeline({ paused: true });
      const S = (k) => T[k].s;

      /* ---------- subtitle: tiap kalimat suara jadi satu kapsyen, waktunya sebanding panjang teks ---------- */
      const capsEl = document.getElementById("caps");
      const sentenceStarts = {};
      CAPS.forEach((v) => {
        const parts = v.t.match(/[^.?!]+[.?!]?/g).map((x) => x.trim()).filter(Boolean);
        const total = parts.reduce((a, p) => a + p.length, 0);
        let t = v.s;
        parts.forEach((p, i) => {
          const len = (p.length / total) * v.d;
          const el = document.createElement("div");
          el.className = "cap " + v.k;
          el.textContent = p;
          capsEl.appendChild(el);
          tl.set(el, { opacity: 1 }, t);
          tl.set(el, { opacity: 0 }, t + len - 0.02);
          if (i === 1 && v.k === "hook" && v.s > 60) sentenceStarts.z = t;
          t += len;
        });
      });

      const rise = (sel, t, d = 0.7, y = 30, stagger = 0) =>
        tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out", stagger }, t);
      /* potongan antar adegan: layar menggelap sebentar supaya perpindahan tidak kasar */
      const dip = (t) => {
        tl.fromTo("#dip", { opacity: 0 }, { opacity: 0.8, duration: 0.12, ease: "power1.in" }, t - 0.12);
        tl.to("#dip", { opacity: 0, duration: 0.28, ease: "power1.out" }, t);
      };
      ["h2", "h3", "w1", "w2", "w3", "w4", "w5", "w6", "w7", "z"].forEach((k) => dip(S(k)));

      /* ---------- logo pembuka ---------- */
      tl.fromTo("#h3mark", { opacity: 0, scale: 0.6, rotate: -8 }, { opacity: 1, scale: 1, rotate: 0, duration: 0.7, ease: "back.out(1.5)" }, S("h3") + 0.25);
      rise("#h3name", S("h3") + 0.4, 0.8, 26);
      tl.to("#h3rule", { width: 260, duration: 0.8, ease: "power3.inOut" }, S("h3") + 1.0);

      /* ---------- walkthrough ---------- */
      tl.set("#demo-bg", { opacity: 1 }, S("w1"));
      tl.set("#win", { opacity: 1 }, S("w1"));
      tl.set("#demo-bg", { opacity: 0 }, T.w7.e);
      tl.set("#win", { opacity: 0 }, T.w7.e);
      const zoom = (k, off, origin, scale, d = 1.3) => {
        tl.set("#zoom", { transformOrigin: origin, scale: 1 }, S(k) + off - 0.01);
        tl.to("#zoom", { scale, duration: d, ease: "power2.inOut" }, S(k) + off);
      };
      zoom("w1", 0.4, "100% 10%", 1.35, 1.4);
      zoom("w2", 0.3, "30% 70%", 1.5, 1.3);
      zoom("w3", 1.2, "50% 55%", 1.15, 1.6);
      zoom("w4", 4.6, "40% 58%", 1.5, 1.4);
      zoom("w5", 0.6, "50% 62%", 1.25, 1.4);
      zoom("w6", 0.3, "18% 56%", 1.4, 1.3);
      zoom("w7", 0.4, "80% 28%", 1.35, 1.3);
      ["w1", "w2", "w3", "w4", "w5", "w6", "w7"].forEach((k) => rise("#st-" + k, S(k) + 0.15, 0.5, 10));
      tl.fromTo("#sb", { opacity: 0 }, { opacity: 1, duration: 0.6 }, S("w1") + 0.4);

      /* ---------- penutup: adegan hangat dulu, lalu logo dan slogan ---------- */
      const zt = sentenceStarts.z || (S("z") + 3.2);
      tl.to("#zveil", { opacity: 1, duration: 0.9, ease: "power2.inOut" }, zt - 0.3);
      tl.to("#zvig", { opacity: 0, duration: 0.6 }, zt - 0.3);
      tl.to("#ztag", { opacity: 0, duration: 0.4 }, zt - 0.3);
      tl.set("#zlock", { opacity: 1 }, zt + 0.1);
      tl.fromTo("#zmark", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, zt + 0.1);
      rise("#zlock .name", zt + 0.2, 0.7, 24);
      tl.to("#zrule", { opacity: 1, duration: 0.01 }, zt + 0.5);
      rise("#zslogan", zt + 0.9, 0.7, 16);
      rise("#zlock .tim", zt + 1.6, 0.6, 10);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
